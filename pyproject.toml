[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moe-sheaf"
version = "0.1.0"
description = "Sheaf cohomology of MoE routing — test DeepSeek's conjecture on generalization"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
